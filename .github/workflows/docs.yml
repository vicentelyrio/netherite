name: Docs

# The documentation site (ADR-00028) is built from apps/docs/ on every pull request, so a broken link
# or page fails before it is merged, and published to GitHub Pages when main changes. In the
# repository settings, Pages must use "GitHub Actions" as its source.

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "README.md"
      - "scripts/gen-reference.mjs"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "apps/docs/**"
      - "README.md"
      - "scripts/gen-reference.mjs"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The reference pages come from the program, so the program is built and they are compared.
      - run: pnpm turbo run build --filter=@netherite/cli --filter=@netherite/core
      - name: Reference pages are up to date
        run: pnpm docs:check
      - run: pnpm docs:build

      - uses: actions/configure-pages@v6
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: apps/docs/.vitepress/dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
