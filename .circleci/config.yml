version: 2.1
orbs:
  node: circleci/node@5.0.2
workflows:
  test:
    jobs:
      - test
jobs:
  test:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: yarn
      - run:
          name: Build packages
          command: yarn build
      - run:
          name: Lint packages
          command: yarn lint
      - run:
          name: Test packages
          command: yarn test
